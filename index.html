<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Young+Serif&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>

  <main class="container">

    <div class="card-1">
      <h3>Your Result</h3>
      <div class="score-circle">
        <p class="score">76</p>
        <p>of 100</p>
      </div>
      <h2>Great</h2>
      <p class="card1-paragraph">You scored higher than 65% of the people who have taken these tests.</p>
    </div>

    <div class="card-2">
      <h3>Summary</h3>

      <div class="summary-container">

        <!--REACTION CONTAINER-->
        <div class="reaction-container">
          <div class="icon-container">
            <img src="assets\images\icon-reaction.svg" alt="reaction icon">
            <span class="reaction-title">Reaction</span>
          </div>
          <p>80 <span class="total-score">/ 100</span> </p>
        </div>

        <!--MEMORY CONTAINER-->
        <div class="memory-container">
          <div class="icon-container">
            <img src="assets\images\icon-memory.svg" alt="memory icon">
            <span class="memory-title">Memory</span>
          </div>
          <p>92 <span class="total-score">/ 100</span> </p>
        </div>

        <!--VERBAL CONTAINER-->
        <div class="verbal-container">
          <div class="icon-container">
            <img src="assets\images\icon-verbal.svg" alt="verbal icon">
            <span class="verbal-title">Verbal</span>
          </div>
          <p>61 <span class="total-score">/ 100</span> </p>
        </div>

        <!--VISUAL CONTAINER-->
        <div class="visual-container">
          <div class="icon-container">
            <img src="assets\images\icon-visual.svg" alt="visual icon">
            <span class="visual-title">Visual</span>
          </div>
          <p>72 <span class="total-score">/ 100</span> </p>
        </div>

      </div>

      <a class="continue-button" href="#">Continue</a>

    </div>

  </main>

  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/asha-16">Asha</a>.
  </div>
</body>
</html>
