<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900" rel="stylesheet">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>

</head>
<body>

  <main class="huddle-landing-page">
    <header class="header">
      <img class="message-icon" src="images\message.svg" alt="message icon">
      <h1 class="huddle-logo">Huddle</h1>
    </header>
    
    <div class="huddle__content">
      <img  src="images\illustration-mockups.svg" alt="illustration">
      <div class="huddle__text">
        <h2 class="huddle_heading"> Build The Community Your Fans Will Love </h2>
        <p class="huddle_paragraph">
           Huddle re-imagines the way we build communities. You have a voice, but so does your audience. 
          Create connections with your users as you engage in genuine discussion. 
        </p>
        <a class="register-btn" href="#">Register</a>
      </div>
    </div>

    <div class="social-icons">
      <img class="icons social-icon" src="images\facebook.svg" alt="facebook icon">
      <img class="icons social-icon" src="images\twitter.svg" alt="twitter logo">
      <img class="icons social-icon" src="images\instagram.svg" alt="instagram logo">
    </div>
  </main>

 

  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/asha-16" target="_blank">Asha H P</a>.
    </p>
  </footer>
</body>
</html>
